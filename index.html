<style>
  :root {
    --navy: #1F396A;
    --blue: #4C719C;
    --gold: #DDAE36;
    --grey: #424242;
    --bg: #D1DBE5;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Inter, system-ui, sans-serif;
    background: var(--bg);
    color: var(--grey);
    line-height: 1.5;
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 56px 20px 64px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header h1 {
    font-size: clamp(2.2rem, 7vw, 3.4rem);
    font-weight: 800;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    line-height: 1.05;
  }
  header h1 span { color: var(--gold); }
  header p { margin-top: 14px; opacity: 0.85; font-size: 1.05rem; }
  main { padding: 0 20px 64px; margin-top: -32px; }
  .event { scroll-margin-top: 16px; transition: box-shadow 0.4s; }
  .event.hit { box-shadow: 0 0 0 4px var(--gold), 0 6px 24px rgba(31, 57, 106, 0.12); }
  .event {
    background: var(--card);
    border-radius: 16px;
    padding: 28px 24px;
    margin-bottom: 20px;
    box-shadow: 0 6px 24px rgba(31, 57, 106, 0.12);
  }
  .date {
    display: inline-block;
    background: var(--gold);
    color: var(--navy);
    font-weight: 800;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .event h2 {
    color: var(--navy);
    font-size: 1.6rem;
    font-weight: 800;
    margin: 12px 0 8px;
    text-transform: uppercase;
  }
  .event p { margin-bottom: 14px; }
  .facts { list-style: none; margin-bottom: 20px; }
  .facts li { padding: 6px 0; border-top: 1px solid #E6ECF2; display: grid; grid-template-columns: 72px 1fr; column-gap: 8px; }
  .facts li strong { color: var(--navy); }
  .btn {
    display: inline-block;
    background: var(--navy);
    color: #fff;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    text-decoration: none;
    padding: 14px 26px;
    border-radius: 999px;
  }
  .btn:hover { background: var(--blue); }
  .btn.off { background: #9AA8B8; pointer-events: none; }
  .event { position: relative; overflow: hidden; }
  .few { display: inline-block; margin: 0 0 16px; padding: 6px 12px; border-radius: 8px; background: #FDECEC; color: #C62828; font-weight: 800; font-size: 0.95rem; }
  .event.full > :not(.stamp) { opacity: 0.55; }
  .event.full .btn:not(.off) { opacity: 1; }
  .stamp {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-14deg);
    border: 5px solid #C62828; color: #C62828; border-radius: 12px;
    padding: 8px 22px; font-size: clamp(1.8rem, 8vw, 2.8rem); font-weight: 900;
    letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;
    background: rgba(255, 255, 255, 0.75); pointer-events: none;
    box-shadow: inset 0 0 0 3px rgba(198, 40, 40, 0.25);
  }
  .wl { margin: 12px 0 0; font-size: 0.9rem; }
  .wl a { color: var(--navy); font-weight: 600; }
  .empty { background: var(--card); border-radius: 16px; padding: 28px 24px; text-align: center; }
  footer { text-align: center; font-size: 0.85rem; padding: 0 20px 40px; color: var(--navy); opacity: 0.7; }
</style>
</head>
<body>

<main>
  <div class="wrap" id="events"></div>
</main>

<footer>Koblenz · Fragen? <a href="https://wa.me/4915161034133" style="color: inherit; font-weight: 600;">Schreib mir einfach auf WhatsApp.</a><br><a href="/impressum/" style="color: inherit;">Impressum</a> · <a href="/datenschutz/" style="color: inherit;">Datenschutz</a></footer>

<script>
  // ===== EVENTS PFLEGEN: neues Event = neuer Eintrag in dieser Liste =====
  // date: Tag des Events (JJJJ-MM-TT). Vergangene Events verschwinden automatisch.
  // fewAt: ab wann "Nur noch X Plätze" kommt (Standard: unter 10).
  // sheet/max: Blattname in "Event-Teilnehmer" und Platzanzahl – Restplätze kommen automatisch aus dem Blatt "Plätze".
  // soldOut: true setzen, wenn ausgebucht (Button wird grau – oder führt zur Warteliste, falls waitlist gesetzt).
  const EVENTS = [
    {
      slug: "spareribs",
      sheet: "Spare Ribs 10.11.",
      max: 10,
      fewAt: 5,
      date: "2026-11-10",
      title: "Spare Ribs bei Nenad",
      text: "Zarte Spare Ribs vom Grill, kalte Getränke und ein entspannter Abend in netter Runde. Wer zuerst kommt, isst zuerst. Es wird früh dunkel und frisch, also packt eine warme Jacke ein.",
      time: "18:00 Uhr",
      place: "Kurfürstenstraße 56, 56068 Koblenz",
      price: "12 € p. P. inkl. Getränke · nur 10 Plätze",
      link: "https://tally.so/r/VppN0g",
      soldOut: false
    },
    {
      slug: "padel",
      sheet: "Padel 09.11.",
      max: 16,
      date: "2026-11-09",
      title: "Padel Americano",
      text: "Wir spielen ein kleines Americano-Turnier in zwei Spielstärken: Anfänger/Fortgeschrittene und Fortgeschrittene/Profis. Du wechselst jede Runde den Partner, am Ende zählen deine Punkte. Die Einteilung machen wir vor Ort.",
      time: "20:50 Uhr",
      place: "Padel City, Judengäßchen 1, 56218 Mülheim-Kärlich",
      price: "3,50 € p. P. · per PayPal direkt nach der Anmeldung · max. 16 Plätze",
      link: "https://tally.so/r/dbNE9r",
      soldOut: false
    },
    {
      slug: "padel-21",
      sheet: "Padel 23.11.",
      max: 24,
      date: "2026-11-23",
      title: "Padel Americano",
      text: "Wir spielen ein Americano-Turnier in drei Spielstärken: Anfänger, Fortgeschrittene und Profis. Deine Spielstärke wählst du bei der Anmeldung selbst. Du wechselst jede Runde den Partner, am Ende zählen deine Punkte. Bitte mit vollem Namen anmelden.",
      time: "20:00 Uhr",
      place: "Padel City, Judengäßchen 1, 56218 Mülheim-Kärlich",
      price: "5 € p. P. per PayPal direkt nach der Anmeldung · mit Wellpass kostenlos · 24 Plätze + Warteliste",
      link: "https://tally.so/r/zENj18",
      waitlist: "https://tally.so/r/yXNMdp",
      soldOut: false
    },
    {
      slug: "gluehwein",
      sheet: "Glühwein 29.11.",
      date: "2026-11-29",
      title: "Glühwein-Wanderung",
      text: "Wir füllen die Thermoskannen mit Glühwein oder Punsch, fahren mit dem Zug nach Winningen und wandern durch die Weinberge zurück nach Koblenz. Bring deine eigene Thermoskanne mit!",
      time: "Treffen 11:30 Uhr",
      place: "Frankenstraße 21, 56068 Koblenz",
      price: "5 € p. P. inkl. Glühwein oder Punsch",
      link: "https://tally.so/r/vXGqEv",
      soldOut: false
    },
    {
      slug: "padel-30",
      sheet: "Padel 30.11.",
      max: 32,
      fewAt: 15,
      date: "2026-11-30",
      title: "Padel Americano",
      text: "Americano-Turnier auf 4 Feldern. Deine Spielstärke gibst du bei der Anmeldung selbst an – von 1 (Anfänger) bis 4 (Profi), gern mit Tendenz in halben Schritten. Du wechselst jede Runde den Partner, am Ende zählen deine Punkte. Bitte mit vollem Namen anmelden.",
      time: "Treffpunkt 19:50 Uhr · Start 20:00 Uhr",
      place: "Padel City, Judengäßchen 1, 56218 Mülheim-Kärlich",
      price: "5 € p. P. per PayPal direkt nach der Anmeldung · mit Wellpass kostenlos · 32 Plätze + Warteliste",
      link: "https://tally.so/r/rDBZzv",
      waitlist: "https://tally.so/r/xVjWOo",
      soldOut: false
    },
    {
      slug: "quiz",
      sheet: "Quiz 04.12.",
      max: 32,
      date: "2026-12-04",
      title: "Quiz Night",
      text: "Wir rätseln: Quiz Night mit kniffligen Fragen, Snacks, kalten Getränken und Preisen zu gewinnen. Du musst kein Genie sein, um mitzumachen – Spaß steht im Vordergrund. Bring gern Freunde mit, jede Person meldet sich einzeln mit vollem Namen an.",
      time: "19:00 Uhr",
      place: "Frankenstraße 21, 56068 Koblenz",
      price: "10 € p. P. inkl. Snacks & Getränke · per PayPal direkt nach der Anmeldung · max. 32 Plätze",
      link: "https://tally.so/r/OQll8R",
      soldOut: false
    },
    {
      slug: "rosenmontag",
      sheet: "Rosenmontag 08.02.",
      date: "2027-02-08",
      title: "Rosenmontag in Kowelenz – Party",
      text: "Wir eröffnen an Rosenmontag einen Stand in der Südstadt – direkt an der Strecke, an der der Rosenmontagszug vorbeikommt, in der Nähe der Frankenstraße 21. Kostüm an, Laune hoch! Nach der Anmeldung kommst du in unsere WhatsApp-Gruppe – mit Getränke-Umfragen und vielleicht der ein oder anderen Überraschung.",
      time: "Start 11:11 Uhr · Ende offen",
      place: "Unser Stand an der Zugstrecke in der Südstadt, nahe Frankenstraße 21, 56068 Koblenz",
      price: "All you can drink 15 € p. P. · bezahlt wird vor Ort",
      link: "https://tally.so/r/Yj5y70",
      soldOut: false
    }
  ];
  // =======================================================================

  const fmt = new Intl.DateTimeFormat("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const upcoming = EVENTS
    .filter(e => new Date(e.date + "T23:59:59") >= today)
    .sort((a, b) => a.date.localeCompare(b.date));

  const el = document.getElementById("events");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const SEATS_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTZkuG6ITQ3qpJcdCq-FKdPrM4yEJqPtyqoB3Cu-Q5RW8RfrO1QGhUY3Lgd6GqEhRrAjd_ydgyMIGLW/pub?gid=1319352177&single=true&output=csv";

  function render(counts) {
    if (!upcoming.length) {
      el.innerHTML = '<div class="empty">Gerade ist nichts geplant – schau bald wieder vorbei.</div>';
      return;
    }
    el.innerHTML = upcoming.map(e => {
      const n = counts && e.sheet in counts ? counts[e.sheet] : null;
      const free = e.max && n !== null ? e.max - n : null;
      const full = e.soldOut || (free !== null && free <= 0);
      const few = !full && free !== null && free < (e.fewAt || 10);
      return `
      <article class="event${full ? " full" : ""}" id="${esc(e.slug || "")}">
        <span class="date">${esc(fmt.format(new Date(e.date + "T12:00:00")))}</span>
        <h2>${esc(e.title)}</h2>
        <p>${esc(e.text)}</p>
        <ul class="facts">
          <li><strong>Wann</strong><span>${esc(e.time)}</span></li>
          <li><strong>Wo</strong><span>${esc(e.place)}</span></li>
          <li><strong>Preis</strong><span>${esc(e.price)}</span></li>
        </ul>
        ${few ? `<p class="few">Nur noch ${free} ${free === 1 ? "Platz" : "Plätze"} frei!</p>` : ""}
        ${full
          ? (e.waitlist ? `<a class="btn" href="${esc(e.waitlist)}">Auf die Warteliste</a>` : '<span class="btn off">Ausgebucht</span>')
          : `<a class="btn" href="${esc(e.link)}">Jetzt anmelden</a>${e.waitlist ? `<p class="wl">Schon ausgebucht? <a href="${esc(e.waitlist)}">Hier auf die Warteliste</a></p>` : ""}`}
        ${full ? '<div class="stamp">Ausgebucht</div>' : ""}
      </article>`;
    }).join("");
  }

  render(null);
  if (SEATS_CSV.startsWith("http")) {
    fetch(SEATS_CSV + "&t=" + Date.now())
      .then(r => r.ok ? r.text() : Promise.reject())
      .then(txt => {
        const counts = {};
        txt.trim().split(/\r?\n/).slice(1).forEach(line => {
          const m = line.match(/^"?(.*?)"?,"?(\d+)"?$/);
          if (m) counts[m[1]] = +m[2];
        });
        render(counts);
      })
      .catch(() => {});
  }

  // Sprungmarke (#burger etc.): zum Event scrollen und kurz hervorheben
  const hash = decodeURIComponent(location.hash.slice(1));
  const hit = hash && document.getElementById(hash);
  if (hit) {
    hit.classList.add("hit");
    hit.scrollIntoView({ behavior: "smooth", block: "start" });
    setTimeout(() => hit.classList.remove("hit"), 4000);
  }
</script>
</body>
</html>
