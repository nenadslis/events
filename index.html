<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Events mit Nenad</title>
<meta name="description" content="Kommende Events mit Nenad in Koblenz – hier anmelden.">
<meta property="og:title" content="Events mit Nenad">
<meta property="og:description" content="Kommende Events in Koblenz – Plätze sind begrenzt, hier anmelden.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1F396A;
    --blue: #4C719C;
    --gold: #DDAE36;
    --grey: #424242;
    --bg: #D1DBE5;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Inter, system-ui, sans-serif;
    background: var(--bg);
    color: var(--grey);
    line-height: 1.5;
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 56px 20px 64px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header h1 {
    font-size: clamp(2.2rem, 7vw, 3.4rem);
    font-weight: 800;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    line-height: 1.05;
  }
  header h1 span { color: var(--gold); }
  header p { margin-top: 14px; opacity: 0.85; font-size: 1.05rem; }
  main { padding: 0 20px 64px; margin-top: -32px; }
  .event {
    background: var(--card);
    border-radius: 16px;
    padding: 28px 24px;
    margin-bottom: 20px;
    box-shadow: 0 6px 24px rgba(31, 57, 106, 0.12);
  }
  .date {
    display: inline-block;
    background: var(--gold);
    color: var(--navy);
    font-weight: 800;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .event h2 {
    color: var(--navy);
    font-size: 1.6rem;
    font-weight: 800;
    margin: 12px 0 8px;
    text-transform: uppercase;
  }
  .event p { margin-bottom: 14px; }
  .facts { list-style: none; margin-bottom: 20px; }
  .facts li { padding: 6px 0; border-top: 1px solid #E6ECF2; }
  .facts li strong { color: var(--navy); display: inline-block; min-width: 72px; }
  .btn {
    display: inline-block;
    background: var(--navy);
    color: #fff;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    text-decoration: none;
    padding: 14px 26px;
    border-radius: 999px;
  }
  .btn:hover { background: var(--blue); }
  .btn.off { background: #9AA8B8; pointer-events: none; }
  .empty { background: var(--card); border-radius: 16px; padding: 28px 24px; text-align: center; }
  footer { text-align: center; font-size: 0.85rem; padding: 0 20px 40px; color: var(--navy); opacity: 0.7; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Events mit <span>Nenad</span></h1>
    <p>Gutes Essen, gute Leute, begrenzte Plätze. Hier siehst du, was als Nächstes ansteht.</p>
  </div>
</header>

<main>
  <div class="wrap" id="events"></div>
</main>

<footer>Koblenz · Fragen? Schreib mir einfach.</footer>

<script>
  // ===== EVENTS PFLEGEN: neues Event = neuer Eintrag in dieser Liste =====
  // date: Tag des Events (JJJJ-MM-TT). Vergangene Events verschwinden automatisch.
  // soldOut: true setzen, wenn ausgebucht (Button wird grau).
  const EVENTS = [
    {
      date: "2026-10-27",
      title: "Smashed Burger bei Nenad",
      text: "Frisch gesmashte Burger vom Grill, kalte Getränke und ein entspannter Abend in netter Runde. Wer zuerst kommt, isst zuerst. Es wird früh dunkel und frisch, also packt eine warme Jacke ein.",
      time: "18:00 Uhr",
      place: "Kurfürstenstraße 56, 56068 Koblenz",
      price: "12 € p. P. inkl. Getränke · nur 10 Plätze",
      link: "https://tally.so/r/0VQbZ0",
      soldOut: false
    },
    {
      date: "2026-10-29",
      title: "Bowling mit Nenad",
      text: "Ein paar Runden Bowling im Bowling Room, gute Leute und ein lockerer Abend.",
      time: "19:00 Uhr",
      place: "Bowling Room, Im Metternicher Feld 24, 56072 Koblenz",
      price: "Bezahlt wird vor Ort · max. 16 Plätze",
      link: "https://tally.so/r/zExWQR",
      soldOut: false
    }
  ];
  // =======================================================================

  const fmt = new Intl.DateTimeFormat("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const upcoming = EVENTS
    .filter(e => new Date(e.date + "T23:59:59") >= today)
    .sort((a, b) => a.date.localeCompare(b.date));

  const el = document.getElementById("events");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  if (!upcoming.length) {
    el.innerHTML = '<div class="empty">Gerade ist nichts geplant – schau bald wieder vorbei.</div>';
  } else {
    el.innerHTML = upcoming.map(e => `
      <article class="event">
        <span class="date">${esc(fmt.format(new Date(e.date + "T12:00:00")))}</span>
        <h2>${esc(e.title)}</h2>
        <p>${esc(e.text)}</p>
        <ul class="facts">
          <li><strong>Wann</strong> ${esc(e.time)}</li>
          <li><strong>Wo</strong> ${esc(e.place)}</li>
          <li><strong>Preis</strong> ${esc(e.price)}</li>
        </ul>
        ${e.soldOut
          ? '<span class="btn off">Ausgebucht</span>'
          : `<a class="btn" href="${esc(e.link)}">Jetzt anmelden</a>`}
      </article>`).join("");
  }
</script>
</body>
</html>
