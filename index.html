<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Events</title>
<meta name="description" content="Kommende Events in Koblenz – hier anmelden.">
<meta property="og:title" content="Events">
<meta property="og:description" content="Kommende Events in Koblenz – Plätze sind begrenzt, hier anmelden.">
<link rel="stylesheet" href="/fonts/inter.css">
<style>
  :root {
    --navy: #1F396A;
    --blue: #4C719C;
    --gold: #DDAE36;
    --grey: #424242;
    --bg: #D1DBE5;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Inter, system-ui, sans-serif;
    background: var(--bg);
    color: var(--grey);
    line-height: 1.5;
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 56px 20px 64px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header h1 {
    font-size: clamp(2.2rem, 7vw, 3.4rem);
    font-weight: 800;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    line-height: 1.05;
  }
  header h1 span { color: var(--gold); }
  header p { margin-top: 14px; opacity: 0.85; font-size: 1.05rem; }
  main { padding: 0 20px 64px; margin-top: -32px; }
  .event { scroll-margin-top: 16px; transition: box-shadow 0.4s; }
  .event.hit { box-shadow: 0 0 0 4px var(--gold), 0 6px 24px rgba(31, 57, 106, 0.12); }
  .event {
    background: var(--card);
    border-radius: 16px;
    padding: 28px 24px;
    margin-bottom: 20px;
    box-shadow: 0 6px 24px rgba(31, 57, 106, 0.12);
  }
  .date {
    display: inline-block;
    background: var(--gold);
    color: var(--navy);
    font-weight: 800;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .event h2 {
    color: var(--navy);
    font-size: 1.6rem;
    font-weight: 800;
    margin: 12px 0 8px;
    text-transform: uppercase;
  }
  .event p { margin-bottom: 14px; }
  .facts { list-style: none; margin-bottom: 20px; }
  .facts li { padding: 6px 0; border-top: 1px solid #E6ECF2; display: grid; grid-template-columns: 72px 1fr; column-gap: 8px; }
  .facts li strong { color: var(--navy); }
  .btn {
    display: inline-block;
    background: var(--navy);
    color: #fff;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    text-decoration: none;
    padding: 14px 26px;
    border-radius: 999px;
  }
  .btn:hover { background: var(--blue); }
  .btn.off { background: #9AA8B8; pointer-events: none; }
  .empty { background: var(--card); border-radius: 16px; padding: 28px 24px; text-align: center; }
  footer { text-align: center; font-size: 0.85rem; padding: 0 20px 40px; color: var(--navy); opacity: 0.7; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Events</h1>
    <p>Gutes Essen, gute Leute, begrenzte Plätze. Hier siehst du, was als Nächstes ansteht.</p>
  </div>
</header>

<main>
  <div class="wrap" id="events"></div>
</main>

<footer>Koblenz · Fragen? <a href="https://wa.me/4915161034133" style="color: inherit; font-weight: 600;">Schreib mir einfach auf WhatsApp.</a><br><a href="/impressum/" style="color: inherit;">Impressum</a> · <a href="/datenschutz/" style="color: inherit;">Datenschutz</a></footer>

<script>
  // ===== EVENTS PFLEGEN: neues Event = neuer Eintrag in dieser Liste =====
  // date: Tag des Events (JJJJ-MM-TT). Vergangene Events verschwinden automatisch.
  // soldOut: true setzen, wenn ausgebucht (Button wird grau).
  const EVENTS = [
    {
      slug: "burger",
      date: "2026-10-27",
      title: "Smashed Burger bei Nenad",
      text: "Frisch gesmashte Burger vom Grill, kalte Getränke und ein entspannter Abend in netter Runde. Wer zuerst kommt, isst zuerst. Es wird früh dunkel und frisch, also packt eine warme Jacke ein.",
      time: "18:00 Uhr",
      place: "Kurfürstenstraße 56, 56068 Koblenz",
      price: "12 € p. P. inkl. Getränke · nur 10 Plätze",
      link: "https://tally.so/r/0VQbZ0",
      soldOut: false
    },
    {
      slug: "bowling",
      date: "2026-10-29",
      title: "Bowling",
      text: "Ein paar Runden Bowling im Bowling Room, gute Leute und ein lockerer Abend.",
      time: "19:00 Uhr",
      place: "Bowling Room, Im Metternicher Feld 24, 56072 Koblenz",
      price: "Bezahlt wird vor Ort · max. 16 Plätze",
      link: "https://tally.so/r/zExWQR",
      soldOut: false
    },
    {
      slug: "gluehwein",
      date: "2026-11-29",
      title: "Glühwein-Wanderung",
      text: "Wir füllen die Thermoskannen mit Glühwein oder Punsch, fahren mit dem Zug nach Winningen und wandern durch die Weinberge zurück nach Koblenz. Bring deine eigene Thermoskanne mit!",
      time: "Treffen 11:30 Uhr",
      place: "Frankenstraße 21, 56068 Koblenz",
      price: "5 € p. P. inkl. Glühwein oder Punsch",
      link: "https://tally.so/r/vXGqEv",
      soldOut: false
    },
    {
      slug: "rosenmontag",
      date: "2027-02-08",
      title: "Rosenmontag in Kowelenz – Party",
      text: "Wir eröffnen an Rosenmontag einen Stand in der Südstadt – direkt an der Strecke, an der der Rosenmontagszug vorbeikommt, in der Nähe der Frankenstraße 21. Kostüm an, Laune hoch! Nach der Anmeldung kommst du in unsere WhatsApp-Gruppe – mit Getränke-Umfragen und vielleicht der ein oder anderen Überraschung.",
      time: "Start 11:11 Uhr · Ende offen",
      place: "Unser Stand an der Zugstrecke in der Südstadt, nahe Frankenstraße 21, 56068 Koblenz",
      price: "All you can drink 15 € p. P. · bezahlt wird vor Ort",
      link: "https://tally.so/r/Yj5y70",
      soldOut: false
    }
  ];
  // =======================================================================

  const fmt = new Intl.DateTimeFormat("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const upcoming = EVENTS
    .filter(e => new Date(e.date + "T23:59:59") >= today)
    .sort((a, b) => a.date.localeCompare(b.date));

  const el = document.getElementById("events");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  if (!upcoming.length) {
    el.innerHTML = '<div class="empty">Gerade ist nichts geplant – schau bald wieder vorbei.</div>';
  } else {
    el.innerHTML = upcoming.map(e => `
      <article class="event" id="${esc(e.slug || "")}">
        <span class="date">${esc(fmt.format(new Date(e.date + "T12:00:00")))}</span>
        <h2>${esc(e.title)}</h2>
        <p>${esc(e.text)}</p>
        <ul class="facts">
          <li><strong>Wann</strong><span>${esc(e.time)}</span></li>
          <li><strong>Wo</strong><span>${esc(e.place)}</span></li>
          <li><strong>Preis</strong><span>${esc(e.price)}</span></li>
        </ul>
        ${e.soldOut
          ? '<span class="btn off">Ausgebucht</span>'
          : `<a class="btn" href="${esc(e.link)}">Jetzt anmelden</a>`}
      </article>`).join("");
  }

  // Sprungmarke (#burger etc.): zum Event scrollen und kurz hervorheben
  const hash = decodeURIComponent(location.hash.slice(1));
  const hit = hash && document.getElementById(hash);
  if (hit) {
    hit.classList.add("hit");
    hit.scrollIntoView({ behavior: "smooth", block: "start" });
    setTimeout(() => hit.classList.remove("hit"), 4000);
  }
</script>
</body>
</html>
